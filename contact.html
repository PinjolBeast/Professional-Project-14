<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Luxury Estates for personalized real estate assistance. Get in touch with our team for inquiries about premium properties and luxury living.">
    <meta name="keywords" content="contact luxury estates, real estate inquiries, premium properties, luxury living, property assistance">
    <title>Contact Us - Luxury Estates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="relative">
    <header class="bg-white bg-opacity-95 backdrop-blur-md fixed top-0 w-full z-50 shadow-sm">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="logo text-2xl font-bold text-gray-800">Luxury Estates</div>
                <ul class="flex space-x-8">
                    <li><a href="index.html" class="text-gray-700 hover:text-yellow-600 transition duration-300"><i class="fas fa-home mr-1"></i>Home</a></li>
                    <li><a href="sell.html" class="text-gray-700 hover:text-yellow-600 transition duration-300"><i class="fas fa-plus mr-1"></i>Sell</a></li>
                    <li><a href="about.html" class="text-gray-700 hover:text-yellow-600 transition duration-300"><i class="fas fa-info-circle mr-1"></i>About</a></li>
                    <li><a href="contact.html" class="text-gray-700 hover:text-yellow-600 transition duration-300"><i class="fas fa-envelope mr-1"></i>Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="pt-20 pb-20 bg-gray-50 min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">Contact Us</h1>
                <p class="text-xl text-gray-600">Get in touch with our team for personalized assistance.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="bg-white rounded-lg shadow-lg p-8">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Send us a message</h2>
                    <form id="contact-form" class="space-y-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                            <input type="text" id="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                            <textarea id="message" required rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-md">
                            <i class="fas fa-paper-plane mr-2"></i>Send Message
                        </button>
                    </form>
                </div>

                <div class="bg-white rounded-lg shadow-lg p-8">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Our Office</h2>
                    <div class="space-y-4">
                        <div class="flex items-start">
                            <i class="fas fa-map-marker-alt text-yellow-500 mt-1 mr-3"></i>
                            <div>
                                <p class="text-gray-700">123 Luxury Lane</p>
                                <p class="text-gray-700">Premium City, PC 12345</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-phone text-yellow-500 mr-3"></i>
                            <p class="text-gray-700">(123) 456-7890</p>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-envelope text-yellow-500 mr-3"></i>
                            <p class="text-gray-700">info@luxuryestates.com</p>
                        </div>
                    </div>
                    <div class="mt-8">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Follow Us</h3>
                        <div class="flex space-x-4">
                            <a href="#" class="text-gray-600 hover:text-yellow-500 transition duration-300"><i class="fab fa-facebook-f"></i></a>
                            <a href="#" class="text-gray-600 hover:text-yellow-500 transition duration-300"><i class="fab fa-twitter"></i></a>
                            <a href="#" class="text-gray-600 hover:text-yellow-500 transition duration-300"><i class="fab fa-instagram"></i></a>
                            <a href="#" class="text-gray-600 hover:text-yellow-500 transition duration-300"><i class="fab fa-linkedin-in"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="absolute bottom-0 w-full bg-gray-800 text-white py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2023 Luxury Estates. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
